{% extends "base.html" %}
{% block title %}Page Not Found — CampusVoice{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 text-center">
        <div class="card card-shadow p-5">
            <h1 class="display-3 text-secondary"><i class="bi bi-question-circle"></i> 404</h1>
            <h3 class="mb-3">Page Not Found</h3>
            <p class="text-muted">The requested page, complaint, or issue reference could not be found.</p>
            <div class="mt-4">
                <a href="{{ url_for('main.index') }}" class="btn btn-primary">Return to Homepage</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
